<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>CIVIC ORDER — Sector 4</title>
    <style>
      /* Nothing external: the preview iframe has no network, so no CDN fonts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0d10;
        color: #c9d3dd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: #6f7d8b;
        background: #0a0d10;
        transition: opacity 0.25s ease;
      }
      #boot strong {
        font-size: 15px;
        letter-spacing: 0.32em;
        color: #cfd8e2;
        font-weight: 500;
      }
      #boot .err {
        max-width: 52ch;
        letter-spacing: 0;
        line-height: 1.6;
        color: #e2a19a;
        text-transform: none;
      }
      #boot button {
        justify-self: center;
        margin-top: 6px;
        padding: 6px 14px;
        font: inherit;
        letter-spacing: 0.08em;
        color: #c9d3dd;
        background: #171d23;
        border: 1px solid #333f4a;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot"><strong>CIVIC ORDER</strong><span>loading sector 4…</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
